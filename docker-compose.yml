version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: arvex-postgres
    environment:
      POSTGRES_USER: arvex
      POSTGRES_PASSWORD: arvex_secure_password_change_me
      POSTGRES_DB: arvex_cloud
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    ports:
      - '5432:5432'
    networks:
      - arvex-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arvex']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: arvex-redis
    command: redis-server --appendonly yes --requirepass arvex_redis_password_change_me
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - arvex-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arvex-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://arvex:arvex_secure_password_change_me@postgres:5432/arvex_cloud
      REDIS_URL: redis://:arvex_redis_password_change_me@redis:6379
      JWT_SECRET: your_jwt_secret_key_change_me
      JWT_EXPIRES_IN: 24h
      API_PREFIX: /api
      CORS_ORIGIN: http://localhost:3001
      LOG_LEVEL: info
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
    ports:
      - '3000:3000'
    networks:
      - arvex-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arvex-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
    ports:
      - '3001:3000'
    networks:
      - arvex-network
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 15s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: arvex-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    ports:
      - '80:80'
      - '443:443'
    networks:
      - arvex-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

networks:
  arvex-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
